<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<title>clock!</title>
		<link rel="manifest" href="manifest.json">
		<link rel="icon" href="icon-192x192.png">
		<style type="text/css">
		</style> 
		<script type="text/javascript">
			const DateFormatter = function() {
				this.formatOpt = { weekday: "short" };
				this.dateTimeFormat = new Intl.DateTimeFormat("ja-JP", this.formatOpt);
				this.getDatesString = (date) => {
					const strYear = "" + date.getFullYear();
					const strMonth = ("00" + (date.getMonth() + 1)).slice(-2);
					const strDay = ("00" + date.getDate()).slice(-2);
					const strWeek = this.dateTimeFormat.format(date);
					const ret = strYear + '/' + strMonth + '/' + strDay + ' (' + strWeek + ')';
					return ret;
				}
				this.getTimesString = (date) => {
					const strHour = ("00" + date.getHours()).slice(-2);
					const strMin = ("00" + date.getMinutes()).slice(-2);
					const strSec = ("00" + date.getSeconds()).slice(-2);
					const strMillisec = ("000" + date.getMilliseconds()).slice(-3);
					const ret = strHour + ':' + strMin + ':' + strSec;
					//ret += '.' + strMillisec;
					return ret;
				}
				this.getFormatString = (date) => {
					const strDate = this.getDatesString(date);
					const strTime = this.getTimesString(date);
					return strDate + ' ' + strTime;
				};
			};
			const WarekiConverter = function() {
				const WarekiYear = function(startDate, gengo, date) {
					this.startDate = startDate;
					this.gengo = gengo;
					this.date = date;
					this.getYear = () => {
						return this.date.getFullYear() - this.startDate.getFullYear() + 1;
					}
				};
				this.reiwa = new WarekiYear(new Date('2019/05/01 UTC+9'), '令和');
				this.heisei = new WarekiYear(new Date('1989/01/08 UTC+9'), '平成');
				this.showa = new WarekiYear(new Date('1926/12/26 UTC+9'), '昭和');
				this.taisho = new WarekiYear(new Date('1912/07/30 UTC+9'), '大正');
				this.meiji = new WarekiYear(new Date('1868/09/04 UTC+9'), '明治');
				this.getNengo = (date) => {
					const list = [this.reiwa, this.heisei, this.showa, this.taisho, this.meiji];
					for(let i = 0; i < list.length; i++) {
						if(date >= list[i].startDate) {
							return new WarekiYear(
								list[i].startDate,
								list[i].gengo,
								date
							);
						}
					}
					return null;
				}
			}

			/**
			 * onload
			 */
			window.onload = function() {
				const symbole = [
					'🐭 子', '🐮 丑', '🐯 寅',
					'🐰 卯', '🐲 辰', '🐍 巳',
					'🐴 午', '🐏 未', '🐵 申',
					'🐔 酉', '🐶 犬', '🐗 亥'
				];
				const dateFormatter = new DateFormatter();
				const tick = function() {
					const date = new Date();
					// 時間
					(function() {
						const str = dateFormatter.getFormatString(date);
						document.querySelector('#time').textContent = str;
					})();

					// 和暦
					(function() {
						const nengo = new WarekiConverter().getNengo(date);
						document.querySelector('#wareki').textContent = nengo.gengo + ' ' + nengo.getYear() + "年";
					})();

					// 干支
					(function() {
						document.querySelector('#eto').textContent = symbole[((date.getFullYear() + 8) % 12)] + '年';
					})();

					setTimeout(tick, 1000 - new Date().getMilliseconds());
				};
				setTimeout(tick, 0);
			}
		</script>
	</head>
	<body>
		<div>
			<h1>clock!</h1>
		</div>
		<div>
			<div>
				<h2><span id="time">&nbsp;</span></h2>
				<h2><span id="wareki">&nbsp;</span></h2>
				<h2><span id="eto">&nbsp;</span></h2>
			</div>
		</div>
	</body>
</html>
